<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />
    <title>Plague Inc</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: black;
      }

      #unity-canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #0b0b0b;
        color: white;
        font-family: sans-serif;
      }

      #loader.ready {
        cursor: pointer;
      }

      #bar {
        width: 60%;
        height: 12px;
        background: #333;
      }

      #fill {
        height: 100%;
        width: 0%;
        background: #4caf50;
      }
    </style>
  </head>

  <body>
    <div id="loader">
      <div id="text">0 MB / 300 MB</div>
      <div id="bar">
        <div id="fill"></div>
      </div>
    </div>

    <canvas id="unity-canvas" tabindex="0"></canvas>

    <script>
      // An HTML viewer hosts the page, not its Build/ directory. Probe for a
      // real local build, then fall back to this repository's pinned assets.
      // GitHub Raw supports CORS and does not have jsDelivr's package-size cap.
      const REMOTE_ROOT =
        "https://raw.githubusercontent.com/bitball41/PlagueIncEvolved-fixed/3f45bcfd2c54e1d012b6911a2ff317193d73f00f/";
      const loaderName = "bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js";
      const frameworkName = "b4b58f3ff6d98fbfb83482e25e0e9a5c.framework.js";

      async function fetchScript(url) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        try {
          const response = await fetch(url, { signal: controller.signal });
          if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
          const source = await response.text();
          if (!source.trim() || source.trimStart().startsWith("<")) {
            throw new Error("Expected JavaScript from " + url);
          }
          return source;
        } finally {
          clearTimeout(timeout);
        }
      }

      async function resolveAssets() {
        const roots = [];
        const pageBase = new URL(document.baseURI);
        if (pageBase.protocol === "http:" || pageBase.protocol === "https:") {
          roots.push(new URL(".", pageBase).href);
        }
        roots.push(REMOTE_ROOT);

        let lastError;
        for (const root of new Set(roots)) {
          try {
            const source = await fetchScript(new URL("Build/" + loaderName, root).href);
            if (!/function\s+createUnityInstance\s*\(/.test(source)) {
              throw new Error("This host does not contain the Unity build");
            }
            return { root, source };
          } catch (err) {
            lastError = err;
            console.warn("Could not use assets at " + root + ":", err.message);
          }
        }
        throw lastError;
      }

      function loadScript(source) {
        // Raw GitHub sends JS as text/plain with nosniff. Fetch it with CORS,
        // then execute a JavaScript Blob instead of using a raw script URL.
        const src = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
        return new Promise(function (resolve, reject) {
          const script = document.createElement("script");
          script.src = src;
          script.onload = function () {
            if (typeof createUnityInstance === "function") resolve();
            else reject(new Error("Loader loaded but createUnityInstance is missing"));
          };
          script.onerror = function () {
            reject(new Error("Could not load " + src));
          };
          document.body.appendChild(script);
        }).finally(function () {
          URL.revokeObjectURL(src);
        });
      }

      const MAX_RETRIES = 3;
      const RETRY_DELAY_MS = 1000;

      // Per-part progress tracking
      const partProgress = new Map();
      const totalGuess = 331138688;

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function updateUI() {
        let loaded = 0;
        for (const v of partProgress.values()) loaded += v;
        const mb = (loaded / 1024 / 1024).toFixed(1);
        const total = (totalGuess / 1024 / 1024).toFixed(0);
        document.getElementById("text").textContent = mb + " MB / " + total + " MB";
        document.getElementById("fill").style.width = (loaded / totalGuess) * 100 + "%";
      }

      async function fetchPartWithRetry(url, retries = MAX_RETRIES) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);

            // Reset this part's progress on retry
            if (attempt > 0) {
              partProgress.set(url, 0);
              updateUI();
            }

            const reader = res.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              received += value.byteLength;
              partProgress.set(url, received);
              updateUI();
            }

            const out = new Uint8Array(received);
            let off = 0;
            for (const c of chunks) {
              out.set(c, off);
              off += c.byteLength;
            }
            return out.buffer;
          } catch (err) {
            if (attempt < retries) {
              console.warn(`Retry ${attempt + 1}/${retries} for ${url}:`, err.message);
              await sleep(RETRY_DELAY_MS * (attempt + 1));
            } else {
              throw new Error("Failed after " + (retries + 1) + " attempts: " + url);
            }
          }
        }
      }

      const files = [
        { name: "6b69ec426bff8a6bd4e760a1d5f507b9.wasm", parts: 2 },
        { name: "3719aa6c33bf126ed64864ee5fc2fafc.data", parts: 15 }
      ];

      function buildUrls(file, baseBuild) {
        const urls = [];
        for (let i = 0; i < file.parts; i++) {
          urls.push(baseBuild + file.name + ".part" + String(i).padStart(2, "0"));
        }
        return urls;
      }

      async function loadFile(file, baseBuild) {
        const urls = buildUrls(file, baseBuild);

        // All parts fetched in parallel with per-part retry and streaming progress
        const buffers = await Promise.all(urls.map((url) => fetchPartWithRetry(url)));

        let size = 0;
        for (const b of buffers) size += b.byteLength;

        const out = new Uint8Array(size);
        let off = 0;
        for (const b of buffers) {
          out.set(new Uint8Array(b), off);
          off += b.byteLength;
        }

        return out.buffer;
      }

      async function start() {
        document.getElementById("text").textContent = "Connecting to game files…";
        const assets = await resolveAssets();
        const baseBuild = new URL("Build/", assets.root).href;
        const streamingAssetsUrl = new URL("StreamingAssets", assets.root).href;
        updateUI();

        // Prepare both scripts before enabling play so startup stays inside
        // the user's click, including in a sandboxed srcdoc preview.
        const [, framework, wasm, data] = await Promise.all([
          loadScript(assets.source),
          fetchScript(baseBuild + frameworkName),
          loadFile(files[0], baseBuild),
          loadFile(files[1], baseBuild)
        ]);

        const frameworkUrl = URL.createObjectURL(new Blob([framework], { type: "text/javascript" }));
        const wasmUrl = URL.createObjectURL(new Blob([wasm], { type: "application/wasm" }));
        const dataUrl = URL.createObjectURL(new Blob([data]));

        const loader = document.getElementById("loader");
        const text = document.getElementById("text");
        text.textContent = "Click to play";
        document.getElementById("fill").style.width = "100%";
        loader.classList.add("ready");

        // Unity's intro video and audio get blocked unless startup happens
        // inside a click. Without that, the page sits on a black canvas.
        await new Promise(function (resolve) {
          loader.addEventListener("click", resolve, { once: true });
        });

        loader.style.display = "none";

        const canvas = document.querySelector("#unity-canvas");
        canvas.focus();
        await createUnityInstance(canvas, {
          dataUrl: dataUrl,
          frameworkUrl: frameworkUrl,
          codeUrl: wasmUrl,
          streamingAssetsUrl: streamingAssetsUrl,
          companyName: "Ndemic Creations",
          productName: "Plague Inc",
          productVersion: "1.18.3.2"
        });
        URL.revokeObjectURL(frameworkUrl);
        URL.revokeObjectURL(wasmUrl);
        URL.revokeObjectURL(dataUrl);
      }

      start().catch(function (err) {
        const loader = document.getElementById("loader");
        loader.style.display = "flex";
        loader.classList.remove("ready");
        document.getElementById("text").textContent = "Error: " + (err && err.message ? err.message : err);
        console.error(err);
      });
    </script>
  </body>
</html>
