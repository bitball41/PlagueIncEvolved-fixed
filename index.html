<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no" />
    <title>Plague Inc</title>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: black;
      }

      #unity-canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #0b0b0b;
        color: white;
        font-family: sans-serif;
      }

      #loader.ready {
        cursor: pointer;
      }

      #bar {
        width: 60%;
        height: 12px;
        background: #333;
      }

      #fill {
        height: 100%;
        width: 0%;
        background: #4caf50;
      }
    </style>
  </head>

  <body>
    <div id="loader">
      <div id="text">0 MB / 300 MB</div>
      <div id="bar">
        <div id="fill"></div>
      </div>
    </div>

    <canvas id="unity-canvas"></canvas>

    <script>
      // Opening this file from Downloads (file://) cannot fetch the local Build
      // parts. Chrome blocks those reads. Pull them from jsDelivr instead.
      // A normal http(s) host uses the copies sitting next to this page.
      // jsDelivr refuses this repo past 50 MB ("Package size exceeded"), so a
      // downloaded html file has to pull the build from the copy that already
      // serves it. http(s) hosts use the files next to this page.
      const CDN = "https://cdn.jsdelivr.net/gh/Reeyuki/PlagueIncEvolved/";
      const local = location.protocol !== "file:";
      const root = local ? new URL(".", document.baseURI).href : CDN;
      const baseBuild = new URL("Build/", root).href;
      const streamingAssetsUrl = new URL("StreamingAssets", root).href;
      const loaderName = "bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js";

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          const script = document.createElement("script");
          script.src = src;
          script.onload = function () {
            if (typeof createUnityInstance === "function") resolve();
            else reject(new Error("Loader loaded but createUnityInstance is missing"));
          };
          script.onerror = function () {
            reject(new Error("Could not load " + src));
          };
          document.body.appendChild(script);
        });
      }

      // file:// can still load a script that sits next to the html. If that
      // file isn't there, use the copy with the blocking alert removed.
      const loaderReady = local
        ? loadScript(baseBuild + loaderName)
        : loadScript(new URL("Build/" + loaderName, document.baseURI).href).catch(function () {
            return loadScript(
              "https://cdn.jsdelivr.net/gh/bitball41/PlagueIncEvolved-fixed@a3aee51/Build/" + loaderName
            );
          });

      const MAX_RETRIES = 3;
      const RETRY_DELAY_MS = 1000;

      // Per-part progress tracking
      const partProgress = new Map();
      const totalGuess = 317 * 1024 * 1024;

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function updateUI() {
        let loaded = 0;
        for (const v of partProgress.values()) loaded += v;
        const mb = (loaded / 1024 / 1024).toFixed(1);
        const total = (totalGuess / 1024 / 1024).toFixed(0);
        document.getElementById("text").textContent = mb + " MB / " + total + " MB";
        document.getElementById("fill").style.width = (loaded / totalGuess) * 100 + "%";
      }

      async function fetchPartWithRetry(url, retries = MAX_RETRIES) {
        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);

            // Reset this part's progress on retry
            if (attempt > 0) {
              partProgress.set(url, 0);
              updateUI();
            }

            const reader = res.body.getReader();
            const chunks = [];
            let received = 0;

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              received += value.byteLength;
              partProgress.set(url, received);
              updateUI();
            }

            const out = new Uint8Array(received);
            let off = 0;
            for (const c of chunks) {
              out.set(c, off);
              off += c.byteLength;
            }
            return out.buffer;
          } catch (err) {
            if (attempt < retries) {
              console.warn(`Retry ${attempt + 1}/${retries} for ${url}:`, err.message);
              await sleep(RETRY_DELAY_MS * (attempt + 1));
            } else {
              throw new Error("Failed after " + (retries + 1) + " attempts: " + url);
            }
          }
        }
      }

      const files = [
        { name: "6b69ec426bff8a6bd4e760a1d5f507b9.wasm", parts: 2 },
        { name: "3719aa6c33bf126ed64864ee5fc2fafc.data", parts: 15 }
      ];

      function buildUrls(file) {
        const urls = [];
        for (let i = 0; i < file.parts; i++) {
          urls.push(baseBuild + file.name + ".part" + String(i).padStart(2, "0"));
        }
        return urls;
      }

      async function loadFile(file) {
        const urls = buildUrls(file);

        // All parts fetched in parallel with per-part retry and streaming progress
        const buffers = await Promise.all(urls.map((url) => fetchPartWithRetry(url)));

        let size = 0;
        for (const b of buffers) size += b.byteLength;

        const out = new Uint8Array(size);
        let off = 0;
        for (const b of buffers) {
          out.set(new Uint8Array(b), off);
          off += b.byteLength;
        }

        return out.buffer;
      }

      async function start() {
        // wasm and data files loaded fully in parallel
        const [wasm, data] = await Promise.all([loadFile(files[0]), loadFile(files[1])]);

        const wasmUrl = URL.createObjectURL(new Blob([wasm], { type: "application/wasm" }));
        const dataUrl = URL.createObjectURL(new Blob([data]));

        const loader = document.getElementById("loader");
        const text = document.getElementById("text");
        text.textContent = "Click to play";
        document.getElementById("fill").style.width = "100%";
        loader.classList.add("ready");

        // Unity's intro video and audio get blocked unless startup happens
        // inside a click. Without that, the page sits on a black canvas.
        await new Promise(function (resolve) {
          loader.addEventListener("click", resolve, { once: true });
        });

        loader.style.display = "none";

        const canvas = document.querySelector("#unity-canvas");
        canvas.focus();
        await loaderReady;

        await createUnityInstance(canvas, {
          dataUrl: dataUrl,
          frameworkUrl: baseBuild + "b4b58f3ff6d98fbfb83482e25e0e9a5c.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: streamingAssetsUrl,
          companyName: "Ndemic Creations",
          productName: "Plague Inc",
          productVersion: "1.18.3.2"
        });
      }

      start().catch(function (err) {
        const loader = document.getElementById("loader");
        loader.style.display = "flex";
        loader.classList.remove("ready");
        document.getElementById("text").textContent = "Error: " + (err && err.message ? err.message : err);
        console.error(err);
      });
    </script>
  </body>
</html>
